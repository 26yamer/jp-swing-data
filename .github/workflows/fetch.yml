name: fetch-market-data

on:
  schedule:
    - cron: '35 2 * * 1-5'
    - cron: '45 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install --upgrade yfinance pandas requests curl_cffi
      - name: Fetch
        run: python fetch_market_data.py
      - name: Commit
        run: |
          git config user.name  "market-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data
          git diff --staged --quiet || git commit -m "data: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
          git push
