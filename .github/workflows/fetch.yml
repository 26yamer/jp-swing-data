name: fetch-market-data

on:
  schedule:
    - cron: '35 2 * * 1-5'   # 11:35 JST 前場引け直後
    - cron: '45 6 * * 1-5'   # 15:45 JST 大引け後
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90        # 全銘柄スクリーニングがあるため既定の6時間より短く切る
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # requirements.txt から入れる。ここに直接パッケージ名を書くと
      # requirements.txt を更新しても反映されず、追加した依存が入らない。
      - run: pip install --upgrade -r requirements.txt

      # 入ったことを確認してから本体を回す。openpyxl が無いと
      # JPXの銘柄一覧が読めず、候補に銘柄名が付かないまま静かに劣化する。
      - name: Verify deps
        run: |
          python - <<'PY'
          # ★`import importlib` だけでは util 副モジュールは読み込まれない。
          # 以前は他のライブラリが先に読み込んでいて偶然通っていたが、
          # それに依存していたので、Pythonの版が変わった瞬間に落ちた。
          # 副モジュールは明示的に import する。
          import importlib.util, sys
          need = ["yfinance", "pandas", "requests", "openpyxl"]
          miss = [m for m in need if importlib.util.find_spec(m) is None]
          print("installed:", [m for m in need if m not in miss])
          if miss:
              print(f"::error::必要なパッケージが入っていません: {miss}")
              sys.exit(1)
          PY

      # ★JPXの「東証上場銘柄一覧」のキャッシュ。
      #   このリポジトリは public なので、JPX由来のデータを data/ に
      #   コミットすると再配信に当たる（JPXサイト利用条件）。
      #   そこで cache/ に置き、コミットせずに Actions のキャッシュで
      #   実行をまたいで持ち回る。取れなくてもJPXから取り直すだけで止まらない。
      - name: Restore JPX master cache
        uses: actions/cache@v4
        with:
          path: cache
          key: jpx-master-${{ github.run_id }}
          restore-keys: |
            jpx-master-

      - name: Fetch
        run: python fetch_market_data.py

      - name: Commit
        run: |
          git config user.name  "market-data-bot"
          git config user.email "bot@users.noreply.github.com"
          # ★data だけを add する。cache/ は JPX由来なのでコミットしない。
          git add -A data
          git diff --staged --quiet || git commit -m "data: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
          git push
