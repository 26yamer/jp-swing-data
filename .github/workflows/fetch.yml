name: fetch-market-data

on:
  schedule:
    - cron: '35 2 * * 1-5'      # 11:35 JST（前場終了後）
    - cron: '45 6 * * 1-5'      # 15:45 JST（大引け後）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 全銘柄スクリーニング＋5年バックテスト＋J-Quantsの財務取得を1回で走らせる余裕。
    # Actionsの1ジョブ上限は360分。
    timeout-minutes: 330
    env:
      # J-Quants のAPIキー。Secrets はリポジトリのコードでも git 履歴でもない
      # 場所に保管され、fork からの pull_request には渡されない。
      # ここで環境変数として渡すだけ。コードはヘッダーに載せるのみで、
      # ログにも data/ にも書かない。未設定でもジョブは通る（財務の段だけ飛ぶ）。
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # 依存はファイル1箇所で管理する。ここに直接書くと requirements.txt を
      # 更新しても反映されず、実際に openpyxl が入らないまま
      # 「入っているつもり」で走る事故になった。
      - name: Install deps
        run: pip install --upgrade -r requirements.txt

      - name: Verify deps
        run: |
          python - <<'PY'
          import importlib.util, sys
          need = ["yfinance", "pandas", "requests", "curl_cffi"]
          missing = [m for m in need if not importlib.util.find_spec(m)]
          if missing:
              print("::error::依存が入っていません:", missing); sys.exit(1)
          print("依存の確認OK:", need)
          PY

      - name: Fetch
        run: python fetch_market_data.py

      # data/ に生の財務数値やAPIキーが混ざっていないかは
      # スクリプト側の commit_guard() が検査し、見つけたら伏せて
      # ::error:: を出す。ここではその結果を読んで見えるようにする。
      - name: Show guard result
        if: always()
        run: |
          python - <<'PY'
          import json, os
          p = "data/meta.json"
          if not os.path.exists(p):
              print("meta.json が無い"); raise SystemExit(0)
          m = json.load(open(p, encoding="utf-8"))
          g = m.get("commit_guard") or {}
          print("commit_guard:", json.dumps(g, ensure_ascii=False))
          if g.get("raw_fields") or g.get("api_key_found_in"):
              print("::error::公開してはいけない内容が data/ にありました。上を確認してください")
          for k in ("fund", "fund_raw", "kiyohara", "netcash"):
              print(k, ":", json.dumps(m.get(k) or {}, ensure_ascii=False)[:600])
          PY

      # ★push は落ちる。GitHub側の一時的な 500（Internal Server Error）で
      #   [remote rejected] になり、18分かけた取得結果が丸ごと捨てられた
      #   （2026-09-13 18:00 の実行）。1回の一時障害で全部やり直しになる
      #   設計だったのが問題なので、待って何度か試す。
      #   間に pull --rebase を入れるのは、本当に他のコミットが入っていた
      #   場合にも進めるため（--autostash で作業中の変更を退避する）。
      - name: Commit
        run: |
          set -u
          git config user.name  "market-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data
          if git diff --staged --quiet; then
            echo "変更なし。commit も push もしない"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
          for i in 1 2 3 4 5 6; do
            if git push; then
              echo "push 成功（${i}回目）"
              exit 0
            fi
            if [ "$i" -eq 6 ]; then break; fi
            WAIT=$((i * i * 15))
            echo "::warning::push が失敗（${i}回目）。${WAIT}秒待って再試行する。"
            echo "GitHub側の一時的な障害（Internal Server Error）で落ちることがある。"
            sleep "$WAIT"
            git pull --rebase --autostash origin main || true
          done
          echo "::error::push が6回失敗しました。取得したデータはこの実行と一緒に失われます。"
          echo "::error::GitHub Status（https://www.githubstatus.com/）を確認し、"
          echo "::error::落ち着いてから workflow_dispatch で再実行してください。"
          exit 1
